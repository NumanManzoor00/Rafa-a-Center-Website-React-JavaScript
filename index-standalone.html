<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rafa'a Center — Psychological Care Across People, Organizations &amp; Communities</title>
  <link rel="icon" type="image/png" href="image logo.png">
  <meta name="description" content="Rafa'a Center provides ethical, evidence-based psychological care and emotional wellbeing support for children, adolescents, adults, families, organizations, and communities in Bahawalpur, Pakistan." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;500;700&family=Noto+Nastaliq+Urdu:wght@400;500;700&display=swap" rel="stylesheet" />
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <style>
/* =========================================================
   Rafa'a Center — Stylesheet
   1) Tokens + dark theme  2) Base  3) Ambient bg
   4) Navbar (+ theme toggle, auto-hide)  5) Hero  6) Section shell
   7) About  8) Services  9) Service modal  10) Why  11) Steps
   12) Testimonials  13) CTA  14) Contact  15) FAQ  16) Footer
   17) Utilities  18) Responsive
   ========================================================= */

/* ---------- 1. Design tokens ---------- */
:root{
  --teal-900:#123f3a;
  --teal-700:#1b5e56;
  --teal-500:#2a8577;
  --sage-300:#8dbcae;
  --sage-100:#dcebe4;
  --cream:#f7f3ec;
  --cream-2:#efe8db;
  --gold:#d9a45b;
  --gold-dark:#c08a3e;
  --ink:#21322e;
  --ink-soft:#4c5f5a;
  --white:#ffffff;

  --heading:#123f3a;      /* headings/labels (themeable) */
  --band:#eef4f0;         /* alternating section bands   */

  --glass:rgba(255,255,255,.55);
  --glass-border:rgba(255,255,255,.65);
  --shadow-soft:0 18px 50px -20px rgba(18,63,58,.35);
  --shadow-card:0 22px 60px -28px rgba(18,63,58,.45);

  --radius:22px;
  --maxw:1180px;
  --ease:cubic-bezier(.22,1,.36,1);
  --font-display:"Fraunces",Georgia,serif;
  --font-body:"Plus Jakarta Sans",system-ui,-apple-system,sans-serif;
}

/* ---------- Dark theme overrides ---------- */
:root[data-theme="dark"]{
  --cream:#0f1a18;
  --cream-2:#28352f;
  --white:#17221f;
  --ink:#e6efeb;
  --ink-soft:#9fb2ac;
  --heading:#eaf3ef;
  --band:#12201d;
  --sage-100:#1e2f2a;
  --sage-300:#5a7a70;
  --glass:rgba(19,30,28,.62);
  --glass-border:rgba(255,255,255,.10);
  --shadow-soft:0 18px 50px -20px rgba(0,0,0,.55);
  --shadow-card:0 22px 60px -28px rgba(0,0,0,.65);
}
[data-theme="dark"] .nav.scrolled{background:rgba(15,24,22,.86)}
[data-theme="dark"] .mobile-menu{background:rgba(15,24,22,.94)}
[data-theme="dark"] .theme-toggle{background:rgba(255,255,255,.08)}
[data-theme="dark"] .theme-toggle:hover{background:rgba(255,255,255,.16)}
[data-theme="dark"] .aurora span{opacity:.20}

/* ---------- 2. Base ---------- */
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{
  font-family:var(--font-body);color:var(--ink);background:var(--cream);
  line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;
  transition:background .4s var(--ease),color .4s var(--ease);
}
a{color:inherit;text-decoration:none}
img{max-width:100%;display:block}
section{position:relative}
.wrap{width:100%;max-width:var(--maxw);margin:0 auto;padding:0 22px}

/* ---------- 3. Ambient aurora background ---------- */
.aurora{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.aurora span{position:absolute;border-radius:50%;filter:blur(80px);opacity:.5;transition:opacity .5s var(--ease)}
.aurora .b1{width:520px;height:520px;background:radial-gradient(circle,#a9d6c8,transparent 65%);top:-160px;left:-120px}
.aurora .b2{width:480px;height:480px;background:radial-gradient(circle,#f0d7a6,transparent 65%);top:38%;right:-160px}
.aurora .b3{width:560px;height:560px;background:radial-gradient(circle,#bfe0d4,transparent 65%);bottom:-220px;left:30%}

/* ---------- 4. Glass navbar (centered, auto-hide) ---------- */
.nav-shell{position:fixed;top:18px;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:0 16px;transition:transform .4s var(--ease)}
.nav-shell.hidden{transform:translateY(-150%)}
.nav{
  display:flex;align-items:center;gap:20px;width:min(1080px,100%);
  padding:10px 14px 10px 20px;
  background:var(--glass);border:1px solid var(--glass-border);border-radius:999px;
  backdrop-filter:blur(18px) saturate(140%);-webkit-backdrop-filter:blur(18px) saturate(140%);
  box-shadow:var(--shadow-soft);
  transition:box-shadow .35s var(--ease),background .35s var(--ease),padding .35s var(--ease);
}
.nav.scrolled{background:rgba(255,255,255,.82);box-shadow:0 20px 44px -24px rgba(18,63,58,.55)}

.nav-logo{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:18px;color:var(--heading);white-space:nowrap}
.nav-logo img{height:34px;width:auto;transition:transform .3s var(--ease)}
.nav-logo:hover img{transform:scale(1.06) rotate(-2deg)}

.nav-links{display:flex;align-items:center;gap:4px;margin:0 auto}
.nav-links a{position:relative;padding:8px 15px;border-radius:999px;font-size:14.5px;font-weight:500;color:var(--ink-soft);transition:background .25s var(--ease),color .25s var(--ease)}
.nav-links a::after{content:"";position:absolute;left:15px;right:15px;bottom:4px;height:2px;background:var(--gold);border-radius:2px;transform:scaleX(0);transform-origin:left;transition:transform .3s var(--ease)}
.nav-links a:hover{background:rgba(43,133,119,.10);color:var(--teal-500)}
.nav-links a:hover::after{transform:scaleX(1)}

.theme-toggle{flex:none;width:42px;height:42px;border-radius:50%;border:1px solid var(--glass-border);background:rgba(255,255,255,.35);color:var(--heading);cursor:pointer;display:grid;place-items:center;transition:transform .4s var(--ease),background .3s var(--ease),color .3s var(--ease)}
.theme-toggle:hover{transform:rotate(25deg) scale(1.08);background:rgba(255,255,255,.6)}
.theme-toggle svg{width:20px;height:20px}

.nav-cta{display:inline-flex;align-items:center;gap:8px;white-space:nowrap;background:var(--teal-700);color:#fff;padding:11px 20px;border-radius:999px;font-weight:600;font-size:14px;box-shadow:0 10px 24px -10px rgba(27,94,86,.8);transition:transform .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
.nav-cta:hover{background:var(--teal-900);transform:translateY(-2px);box-shadow:0 16px 30px -12px rgba(18,63,58,.9)}
.nav-cta svg{transition:transform .3s var(--ease)}
.nav-cta:hover svg{transform:scale(1.12)}

.nav-burger{display:none;background:none;border:none;cursor:pointer;padding:8px;border-radius:12px}
.nav-burger span{display:block;width:22px;height:2px;background:var(--heading);margin:5px 0;border-radius:2px;transition:.3s var(--ease)}
.nav-burger.open span:nth-child(1){transform:translateY(7px) rotate(45deg)}
.nav-burger.open span:nth-child(2){opacity:0}
.nav-burger.open span:nth-child(3){transform:translateY(-7px) rotate(-45deg)}

.mobile-menu{position:fixed;top:78px;left:16px;right:16px;z-index:49;background:rgba(255,255,255,.94);backdrop-filter:blur(20px);border:1px solid var(--glass-border);border-radius:24px;padding:14px;box-shadow:var(--shadow-card);display:none;flex-direction:column;gap:4px}
.mobile-menu.show{display:flex;animation:drop .25s var(--ease)}
@keyframes drop{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
.mobile-menu a{padding:13px 16px;border-radius:14px;font-weight:500;color:var(--ink);transition:background .2s var(--ease),padding-left .2s var(--ease)}
.mobile-menu a:hover{background:var(--sage-100);padding-left:22px}
.mobile-menu .m-cta{background:var(--teal-700);color:#fff;text-align:center;font-weight:600;margin-top:6px}
.mobile-menu .m-cta:hover{background:var(--teal-900);padding-left:16px}

/* ---------- 5. Hero slider ---------- */
.hero{padding:120px 0 40px}
.slider{position:relative;border-radius:34px;overflow:hidden;min-height:560px;box-shadow:var(--shadow-card)}
.slide{position:absolute;inset:0;opacity:0;transition:opacity 1s var(--ease);pointer-events:none}
.slide.active{opacity:1;pointer-events:auto}
.slide-bg{position:absolute;inset:0}
.slide-bg img{width:100%;height:100%;object-fit:cover;transform:scale(1.04)}
.slide.active .slide-bg img{animation:kenburns 8s var(--ease) forwards}
@keyframes kenburns{from{transform:scale(1.04)}to{transform:scale(1.14)}}
.slide-overlay{position:absolute;inset:0;background:linear-gradient(105deg,rgba(18,63,58,.9) 0%,rgba(18,63,58,.72) 42%,rgba(18,63,58,.15) 100%)}
.slide-inner{position:relative;z-index:2;max-width:640px;padding:64px 56px;color:#fff;height:100%;display:flex;flex-direction:column;justify-content:center}

.eyebrow{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);padding:7px 15px;border-radius:999px;font-size:12.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:22px}
.eyebrow .dot{width:7px;height:7px;border-radius:50%;background:var(--gold)}
.slide h1{font-family:var(--font-display);font-weight:500;font-size:clamp(28px,4vw,44px);line-height:1.12;margin-bottom:18px;letter-spacing:-.01em}
.slide p{font-size:16px;color:rgba(255,255,255,.86);max-width:520px;margin-bottom:28px}
.slide-actions{display:flex;flex-wrap:wrap;gap:14px;align-items:center}

.slider-nav{position:absolute;z-index:3;bottom:28px;right:32px;display:flex;gap:10px}
.slider-nav button{width:44px;height:44px;border-radius:50%;border:1px solid rgba(255,255,255,.4);background:rgba(255,255,255,.16);color:#fff;cursor:pointer;font-size:18px;display:grid;place-items:center;backdrop-filter:blur(6px);transition:background .25s var(--ease),transform .25s var(--ease)}
.slider-nav button:hover{background:rgba(255,255,255,.32);transform:scale(1.08)}
.dots{position:absolute;z-index:3;bottom:34px;left:56px;display:flex;gap:9px}
.dots button{width:10px;height:10px;border-radius:50%;border:none;background:rgba(255,255,255,.4);cursor:pointer;transition:.3s var(--ease);padding:0}
.dots button:hover{background:rgba(255,255,255,.7)}
.dots button.on{background:var(--gold);width:26px;border-radius:6px}

/* ---------- 6. Section shell ---------- */
.sec{padding:86px 0}
.kicker{font-size:12.5px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--teal-500);margin-bottom:14px}
.h2{font-family:var(--font-display);font-weight:500;font-size:clamp(26px,3.4vw,38px);line-height:1.15;color:var(--heading);letter-spacing:-.01em}
.lead{color:var(--ink-soft);font-size:16.5px;max-width:620px;margin-top:16px}
.center{text-align:center;margin:0 auto}
.center .lead{margin-left:auto;margin-right:auto}

/* ---------- Buttons ---------- */
.btn-gold,.btn-teal,.btn-ghost-light{display:inline-flex;align-items:center;gap:9px;font-weight:600;border-radius:999px;cursor:pointer;transition:transform .25s var(--ease),background .25s var(--ease),box-shadow .25s var(--ease)}
.btn-gold{background:var(--gold);color:#3b2a10;padding:14px 26px;font-weight:700;font-size:14.5px;border:none;box-shadow:0 10px 26px -14px rgba(217,164,91,.9)}
.btn-gold:hover{background:var(--gold-dark);transform:translateY(-3px);box-shadow:0 18px 34px -14px rgba(192,138,62,.95)}
.btn-teal{background:var(--teal-700);color:#fff;padding:13px 24px;font-size:14.5px;border:none;margin-top:26px}
.btn-teal:hover{background:var(--teal-900);transform:translateY(-3px);box-shadow:0 16px 30px -14px rgba(18,63,58,.9)}
.btn-ghost-light{color:#fff;border:1px solid rgba(255,255,255,.5);padding:13px 24px;font-size:14px;background:none}
.btn-ghost-light:hover{background:rgba(255,255,255,.14);transform:translateY(-2px)}
.btn-gold svg,.btn-teal svg{transition:transform .3s var(--ease)}
.btn-gold:hover svg,.btn-teal:hover svg{transform:translateX(4px)}

/* ---------- 7. About / Who we support ---------- */
.split{display:grid;grid-template-columns:1.05fr 1fr;gap:56px;align-items:center}
.split-img{border-radius:28px;overflow:hidden;box-shadow:var(--shadow-card);position:relative}
.split-img img{width:100%;aspect-ratio:16/11;object-fit:cover;transition:transform .6s var(--ease)}
.split-img:hover img{transform:scale(1.05)}
.split-img .badge{position:absolute;bottom:18px;left:18px;background:var(--glass);backdrop-filter:blur(12px);border:1px solid var(--glass-border);border-radius:18px;padding:14px 18px;font-weight:600;color:var(--heading);box-shadow:var(--shadow-soft);transition:transform .3s var(--ease)}
.split-img:hover .badge{transform:translateY(-4px)}
.split-img .badge small{display:block;font-weight:500;color:var(--ink-soft);font-size:12.5px}
.pill-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.pill-list span{background:var(--white);border:1px solid var(--cream-2);border-radius:999px;padding:8px 15px;font-size:13.5px;font-weight:500;color:var(--teal-500);box-shadow:0 8px 20px -16px rgba(18,63,58,.5);transition:transform .25s var(--ease),background .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
.pill-list span:hover{background:var(--teal-700);color:#fff;border-color:var(--teal-700);transform:translateY(-3px)}

/* ---------- 8. Services ---------- */
.svc-band{background:linear-gradient(180deg,var(--cream) 0%,var(--band) 100%)}
.svc-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:46px}
.svc-card{background:var(--white);border-radius:24px;overflow:hidden;box-shadow:0 20px 50px -34px rgba(18,63,58,.5);border:1px solid var(--cream-2);transition:transform .35s var(--ease),box-shadow .35s var(--ease);display:flex;flex-direction:column;cursor:pointer;text-align:left}
.svc-card:hover{transform:translateY(-8px);box-shadow:var(--shadow-card)}
.svc-card .thumb{height:190px;overflow:hidden;position:relative}
.svc-card .thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,transparent 55%,rgba(18,63,58,.28));opacity:0;transition:opacity .35s var(--ease)}
.svc-card:hover .thumb::after{opacity:1}
.svc-card .thumb img{width:100%;height:100%;object-fit:cover;transition:transform .55s var(--ease)}
.svc-card:hover .thumb img{transform:scale(1.08)}
.svc-body{padding:24px 24px 26px;display:flex;flex-direction:column;flex:1}
.svc-body h3{font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--heading);margin-bottom:10px;line-height:1.25;transition:color .25s var(--ease)}
.svc-card:hover .svc-body h3{color:var(--teal-500)}
.svc-body p{color:var(--ink-soft);font-size:14.5px;flex:1}
.svc-more{margin-top:16px;font-weight:600;font-size:14px;color:var(--teal-500);display:inline-flex;align-items:center;gap:6px;transition:gap .25s var(--ease)}
.svc-card:hover .svc-more{gap:12px}

/* ---------- 9. Service modal ---------- */
.modal-overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(10,26,24,.55);backdrop-filter:blur(6px);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
.modal-overlay.show{opacity:1;pointer-events:auto}
.modal{background:var(--white);color:var(--ink);border-radius:26px;max-width:560px;width:100%;max-height:88vh;overflow:auto;box-shadow:var(--shadow-card);border:1px solid var(--cream-2);transform:translateY(18px) scale(.98);transition:transform .3s var(--ease)}
.modal-overlay.show .modal{transform:none}
.modal-img{height:200px;overflow:hidden;border-radius:26px 26px 0 0;position:relative}
.modal-img img{width:100%;height:100%;object-fit:cover}
.modal-close{position:absolute;top:14px;right:14px;width:38px;height:38px;border-radius:50%;border:none;background:rgba(0,0,0,.42);color:#fff;font-size:22px;line-height:1;cursor:pointer;display:grid;place-items:center;backdrop-filter:blur(4px);transition:background .2s var(--ease),transform .2s var(--ease)}
.modal-close:hover{background:rgba(0,0,0,.68);transform:rotate(90deg)}
.modal-body{padding:26px 30px 30px}
.modal-body .ideal{display:inline-block;background:var(--sage-100);color:var(--teal-500);font-size:12.5px;font-weight:600;padding:6px 13px;border-radius:999px;margin-bottom:14px}
.modal-body h3{font-family:var(--font-display);font-weight:500;font-size:26px;color:var(--heading);margin-bottom:12px;line-height:1.2}
.modal-body p.desc{color:var(--ink-soft);font-size:15px;margin-bottom:22px}
.modal-body h4{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-500);font-weight:700;margin-bottom:14px}
.modal-incl{list-style:none;display:grid;gap:11px;margin-bottom:26px}
.modal-incl li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;color:var(--ink)}
.modal-incl .tick{flex:none;width:22px;height:22px;border-radius:50%;background:var(--sage-100);color:var(--teal-500);display:grid;place-items:center;font-size:12px;margin-top:1px}
.modal-actions{display:flex;gap:12px;flex-wrap:wrap}

/* ---------- 10. Why choose ---------- */
.why{background:var(--teal-900);color:#fff;border-radius:36px;overflow:hidden;position:relative}
.why::before{content:"";position:absolute;width:420px;height:420px;background:radial-gradient(circle,rgba(217,164,91,.35),transparent 65%);top:-140px;right:-100px}
.why-inner{display:grid;grid-template-columns:1fr 1fr;gap:50px;align-items:center;padding:60px;position:relative;z-index:2}
.why .h2{color:#fff}
.why .kicker{color:var(--gold)}
.why-list{display:grid;grid-template-columns:1fr 1fr;gap:14px 22px;margin-top:14px}
.why-list li{list-style:none;display:flex;align-items:flex-start;gap:11px;font-size:14.5px;color:rgba(255,255,255,.9);transition:transform .25s var(--ease),color .25s var(--ease)}
.why-list li:hover{transform:translateX(5px);color:#fff}
.why-list .tick{flex:none;width:24px;height:24px;border-radius:50%;background:rgba(217,164,91,.2);color:var(--gold);display:grid;place-items:center;font-size:13px;margin-top:1px;transition:background .25s var(--ease),color .25s var(--ease)}
.why-list li:hover .tick{background:var(--gold);color:var(--teal-900)}
.why-photo{border-radius:26px;overflow:hidden;box-shadow:0 30px 70px -30px rgba(0,0,0,.6)}
.why-photo img{width:100%;aspect-ratio:4/5;object-fit:cover;transition:transform .6s var(--ease)}
.why-photo:hover img{transform:scale(1.05)}

/* ---------- 11. How it works ---------- */
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;margin-top:48px}
.step{background:var(--white);border-radius:24px;padding:34px 28px;position:relative;border:1px solid var(--cream-2);box-shadow:0 20px 50px -36px rgba(18,63,58,.5);transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s var(--ease)}
.step:hover{transform:translateY(-6px);box-shadow:var(--shadow-card);border-color:var(--sage-300)}
.step .num{font-family:var(--font-display);font-size:44px;color:var(--sage-300);font-weight:500;line-height:1;margin-bottom:14px;transition:color .3s var(--ease)}
.step:hover .num{color:var(--gold)}
.step h3{font-family:var(--font-display);font-weight:500;font-size:20px;color:var(--heading);margin-bottom:8px}
.step p{color:var(--ink-soft);font-size:14.5px}
.step .line{position:absolute;top:52px;right:-14px;width:28px;height:2px;background:var(--sage-300);opacity:.6}
.step:last-child .line{display:none}

/* ---------- 12. Testimonials ---------- */
.tst-band{background:linear-gradient(180deg,var(--band),var(--cream))}
.tst-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:44px}
.tst{background:var(--white);border-radius:26px;padding:36px;box-shadow:0 22px 60px -40px rgba(18,63,58,.55);border:1px solid var(--cream-2);position:relative;transition:transform .35s var(--ease),box-shadow .35s var(--ease)}
.tst:hover{transform:translateY(-6px);box-shadow:var(--shadow-card)}
.tst .quote{font-family:var(--font-display);font-size:60px;line-height:.5;color:var(--sage-300);height:26px;display:block}
.tst p{font-size:16px;color:var(--ink);margin:8px 0 22px;font-style:italic}
.tst .who{display:flex;align-items:center;gap:12px}
.tst .av{width:44px;height:44px;border-radius:50%;background:var(--sage-100);color:var(--teal-500);display:grid;place-items:center;font-weight:700;font-family:var(--font-display);transition:background .3s var(--ease),color .3s var(--ease)}
.tst:hover .av{background:var(--teal-700);color:#fff}
.tst .who b{color:var(--heading);font-weight:600}
.tst .who small{display:block;color:var(--ink-soft);font-weight:500}

/* ---------- 13. CTA banner ---------- */

.cta-band p{color:rgba(255,255,255,.85);max-width:560px;margin:16px auto 30px;position:relative;z-index:2}
.cta-actions{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;position:relative;z-index:2}

/* ---------- 14. Contact ---------- */

.info-cards{display:grid;gap:16px;margin-top:26px}
.info-card{display:flex;gap:16px;align-items:flex-start;background:var(--white);border:1px solid var(--cream-2);border-radius:20px;padding:20px 22px;box-shadow:0 14px 40px -30px rgba(18,63,58,.5);transition:transform .3s var(--ease),box-shadow .3s var(--ease),border-color .3s var(--ease)}

a.info-card:hover,.info-card:hover{transform:translateY(-4px);box-shadow:var(--shadow-soft);border-color:var(--sage-300)}
.info-card .ic{flex:none;width:46px;height:46px;border-radius:14px;background:var(--sage-100);color:var(--teal-500);display:grid;place-items:center;transition:background .3s var(--ease),color .3s var(--ease)}
.info-card:hover .ic{background:var(--teal-700);color:#fff}
.info-card b{display:block;color:var(--heading);font-size:14px;margin-bottom:2px}
.info-card .val{color:var(--ink-soft);font-size:14.5px}
.info-card:hover .val{color:var(--teal-500)}
.map{border-radius:22px;overflow:hidden;box-shadow:var(--shadow-card);border:1px solid var(--cream-2);height:320px;margin-top:20px}
.map iframe{width:100%;height:100%;border:0}

.form{background:var(--white);border-radius:26px;padding:34px;box-shadow:var(--shadow-card);border:1px solid var(--cream-2)}
.form h3{font-family:var(--font-display);font-weight:500;font-size:24px;color:var(--heading);margin-bottom:6px}
.form .sub{color:var(--ink-soft);font-size:14.5px;margin-bottom:22px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--heading);margin-bottom:7px}
.field input,.field select,.field textarea{width:100%;padding:12px 15px;border:1px solid var(--cream-2);border-radius:14px;font-family:inherit;font-size:14.5px;color:var(--ink);background:var(--cream);transition:border-color .2s var(--ease),box-shadow .2s var(--ease),background .2s var(--ease)}
.field input:hover,.field select:hover,.field textarea:hover{border-color:var(--sage-300)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--sage-300);box-shadow:0 0 0 3px rgba(141,188,174,.3);background:var(--white)}
.field textarea{resize:vertical;min-height:110px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.submit{width:100%;background:var(--teal-700);color:#fff;border:none;padding:15px;border-radius:14px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;transition:background .25s var(--ease),transform .25s var(--ease),box-shadow .25s var(--ease);margin-top:6px}
.submit:hover{background:var(--teal-900);transform:translateY(-2px);box-shadow:0 16px 30px -14px rgba(18,63,58,.85)}
.form-note{margin-top:14px;text-align:center;font-size:13.5px;color:var(--teal-500);font-weight:600}

/* ---------- 15. FAQ ---------- */
.faq{max-width:820px;margin:44px auto 0}
.qa{background:var(--white);border:1px solid var(--cream-2);border-radius:18px;margin-bottom:12px;overflow:hidden;transition:box-shadow .25s var(--ease),border-color .25s var(--ease)}
.qa:hover{border-color:var(--sage-300)}
.qa.open{box-shadow:var(--shadow-soft)}
.qa button{width:100%;text-align:left;background:none;border:none;cursor:pointer;padding:20px 22px;display:flex;justify-content:space-between;align-items:center;gap:16px;font-family:inherit;font-size:16px;font-weight:600;color:var(--heading);transition:color .2s var(--ease)}
.qa button:hover{color:var(--teal-500)}
.qa .ico{flex:none;width:28px;height:28px;border-radius:50%;background:var(--sage-100);color:var(--teal-500);display:grid;place-items:center;font-size:18px;transition:transform .3s var(--ease),background .3s var(--ease),color .3s var(--ease)}
.qa.open .ico{transform:rotate(45deg);background:var(--teal-700);color:#fff}
.qa .ans{max-height:0;overflow:hidden;transition:max-height .35s var(--ease),padding .35s var(--ease);padding:0 22px;color:var(--ink-soft);font-size:14.5px}
.qa.open .ans{max-height:260px;padding:0 22px 22px}

/* ---------- 16. Footer ---------- */
footer{background:var(--teal-900);color:rgba(255,255,255,.82);margin-top:90px;position:relative;overflow:hidden}
footer::before{content:"";position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(141,188,174,.16),transparent 65%);top:-260px;right:-160px}
.f-top{display:grid;grid-template-columns:1.4fr 1fr 1.2fr;gap:48px;padding:64px 0 40px;position:relative;z-index:2}
.f-brand img{height:44px;margin-bottom:18px;filter:brightness(0) invert(1)}
.f-brand p{font-size:14.5px;max-width:320px;line-height:1.7}
.f-brand .tagline{font-family:var(--font-display);color:#fff;font-size:17px;margin-bottom:12px}
.f-col h4{color:#fff;font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;margin-bottom:18px}
.f-col ul{list-style:none;display:grid;gap:11px}
.f-col a{font-size:14.5px;transition:color .25s var(--ease),padding-left .25s var(--ease)}
.f-col a:hover{color:var(--gold);padding-left:6px}
.f-contact li{display:flex;gap:11px;align-items:flex-start;font-size:14.5px;margin-bottom:13px;list-style:none}
.f-contact .ic{flex:none;color:var(--gold);margin-top:2px}
.f-contact a{transition:color .25s var(--ease)}
.f-contact a:hover{color:var(--gold)}
.socials{display:flex;gap:12px;margin-top:22px}
.socials a{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);display:grid;place-items:center;color:#fff;transition:transform .3s var(--ease),background .3s var(--ease),border-color .3s var(--ease)}

.f-bottom{border-top:1px solid rgba(255,255,255,.12);padding:22px 0;display:flex;justify-content:space-between;align-items:center;gap:16px;flex-wrap:wrap;position:relative;z-index:2;font-size:13.5px}
.f-bottom .made{color:rgba(255,255,255,.55)}

.reveal{opacity:0;transform:translateY(26px);transition:opacity .7s var(--ease),transform .7s var(--ease)}

.wa-float{position:fixed;bottom:24px;right:24px;z-index:40;width:58px;height:58px;border-radius:50%;background:#25d366;display:grid;place-items:center;box-shadow:0 14px 34px -10px rgba(37,211,102,.7);transition:transform .3s var(--ease),box-shadow .3s var(--ease)}

@media(max-width:960px){

  .split,.why-inner,.contact-grid{grid-template-columns:1fr;gap:36px}
  .svc-grid,.steps{grid-template-columns:1fr 1fr}
  .why-list{grid-template-columns:1fr}
  .tst-grid{grid-template-columns:1fr}
  .f-top{grid-template-columns:1fr 1fr;gap:36px}
  .why-photo{order:-1}
  .slide-inner{padding:44px 32px}
}
@media(max-width:620px){
  .svc-grid,.steps,.row2{grid-template-columns:1fr}
  .f-top{grid-template-columns:1fr}
  .slider{min-height:520px}
  .sec{padding:64px 0}
  .why-inner,.cta-band{padding:40px 26px}
  .dots{left:32px}
  .slider-nav{right:20px}
  .f-bottom{flex-direction:column;text-align:center}
  .modal-body{padding:22px 22px 26px}
}
@media(prefers-reduced-motion:reduce){
  *{transition:none!important;animation:none!important;scroll-behavior:auto}
  .reveal{opacity:1;transform:none}
  .slide.active .slide-bg img{animation:none}
}
